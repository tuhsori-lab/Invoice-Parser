name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check the shared invoice schema
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Build the sample PDFs
        run: npm run fixtures

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the sample PDFs
        run: npm run fixtures

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  ocr-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/requirements*.txt

      # The fast tests stand in for PaddleOCR, so its large wheels are not needed here.
      - name: Install
        run: |
          grep -vE '^(paddle|#)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt pytest==9.1.1 httpx==0.28.1 fakeredis==2.40.0

      - name: Test
        run: python -m pytest -m "not slow"

      - name: The shared schema fixture is up to date
        run: git diff --exit-code ../packages/invoice-schema/fixtures/
