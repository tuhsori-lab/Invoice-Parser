<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Invoice Hub splits bulk PDFs into individual, correctly named invoices and checks them against your own lists. Everything happens in your browser; no file is ever uploaded."
    />
    <meta name="application-name" content="Invoice Hub" />
    <meta name="apple-mobile-web-app-title" content="Invoice Hub" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Invoice Hub" />
    <meta
      property="og:description"
      content="Split bulk invoice PDFs and check them against your lists, entirely in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Invoice Hub</title>
    <script>
      // Settle the theme before anything is painted, so the page never flashes
      // the wrong colours. The app keeps this attribute up to date afterwards.
      (function () {
        try {
          var saved = localStorage.getItem('invoice-splitter.theme.v1');
          var dark =
            saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
